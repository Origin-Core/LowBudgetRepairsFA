name: Build PersianRTLFixer Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Add BepInEx NuGet Source
      run: dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Plugin
      run: dotnet build --configuration Release --no-restore

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PersianRTLFixer-Plugin
        path: bin/Release/net6.0/PersianRTLFixer.dll
