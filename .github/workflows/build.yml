name: Build BepInEx Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # اجازه اجرای دستی

jobs:
  build:
    runs-on: windows-latest    # چون بازی ویندوزه
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'   # نسخه SDK مورد نیاز پروژه

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Run tests (if any)
        run: dotnet test --configuration Release --no-build --verbosity normal
        continue-on-error: true    # اگه تستی نداری، خطا نده

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LowBudgetRepairsFA-Plugin
          path: |
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.json
          if-no-files-found: warn
